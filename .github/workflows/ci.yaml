name: CI

on:
    push:
    pull_request:
        types: [opened, synchronize]

jobs:
    build:
        name: Build
        timeout-minutes: 15
        runs-on: ubuntu-latest

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Setup Bun environment
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install

            - name: Run tests
              run: bun test

            - name: Build
              run: bun run build